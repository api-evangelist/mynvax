name: Mynvax
description: 'Mynvax is a clinical-stage vaccine biotechnology company based in Bengaluru, India,
  developing recombinant, thermostable vaccines for respiratory viral infections. Spun out of the
  Indian Institute of Science (IISc), the company applies protein-stabilization and structure-based
  antigen design to create thermotolerant COVID-19 and influenza vaccine candidates aimed at
  affordable distribution in low- and lower-middle-income countries without deep cold-chain
  requirements. Mynvax is a life-sciences research company and does not currently publish a public
  developer API, documentation portal, or technical integration surface. This profile was surfaced
  as a portfolio company of Accel and is maintained in the API Evangelist network for discovery.'
